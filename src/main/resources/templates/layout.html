<!DOCTYPE html>
<!--/*
  Layout base (tela 2 do inventário, prefixo data-testid "menu-").

  Uso numa tela:
    <html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
          th:replace="~{layout :: pagina(titulo='Minhas reservas', conteudo=~{::#conteudo-pagina})}">
    <body><div id="conteudo-pagina"> ... </div></body></html>

  O menu depende de atributos de modelo que o back-end preenche (docs/frontend/README.md):
    usuario : nome, perfil                      (ausente = visitante: só a marca)
    menu    : lista de id, rotulo, href, ativo  (itens do perfil)
*/-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="pagina(titulo, conteudo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Organização de Recursos'">Organização de Recursos</title>
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>
<a class="pular-conteudo" href="#conteudo" data-testid="menu-pular">Pular para o conteúdo</a>

<header class="barra" data-aberto="false" data-menu>
    <div class="barra__linha">
        <a class="barra__marca" th:href="@{/}" data-testid="menu-marca">Organização de Recursos</a>

        <button type="button" class="menu__botao" data-testid="menu-abrir" th:if="${usuario != null}"
                aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-painel">
            <span class="menu__barra"></span>
            <span class="menu__barra"></span>
            <span class="menu__barra"></span>
        </button>

        <nav class="menu__painel" id="menu-painel" aria-label="Principal" th:if="${usuario != null}">
            <ul class="menu__lista">
                <li th:each="item : ${menu}">
                    <a class="menu__item" th:href="@{${item.href}}" th:text="${item.rotulo}"
                       th:attr="data-testid='menu-item-' + ${item.id}"
                       th:aria-current="${item.ativo} ? 'page'">Item</a>
                </li>
            </ul>
            <div class="menu__rodape">
                <p class="menu__usuario">
                    <span class="menu__nome" data-testid="menu-usuario" th:text="${usuario.nome}">Nome</span>
                    <span class="menu__perfil" data-testid="menu-perfil" th:text="${usuario.perfil}">Perfil</span>
                </p>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="botao botao--secundario" data-testid="menu-sair">Sair</button>
                </form>
            </div>
        </nav>
    </div>
</header>

<main class="conteudo" id="conteudo" tabindex="-1">
    <th:block th:replace="${conteudo}"></th:block>
</main>

<script th:src="@{/js/menu.js}" defer></script>
</body>
</html>
