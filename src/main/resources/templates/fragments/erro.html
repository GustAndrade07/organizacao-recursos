<!DOCTYPE html>
<!--/*
  Corpo das páginas de erro (tela 3 do inventário, prefixo data-testid "erro-").
  tom: aviso | info | perigo. acao2Rotulo/acao2Href podem ser null (só uma ação).
  O destino da ação principal só é aceito se for um caminho deste site (regra única em CaminhoDoSite, exposta como ${caminhoDoSite}:
  "/<TAB>/x", "/\x", "//x", "%2f" etc. são recusados); qualquer outra coisa vira o início.
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section class="erro" th:fragment="erro(codigo, tom, titulo, mensagem, acaoRotulo, acaoHref, acao2Rotulo, acao2Href)">
    <p class="erro__codigo" th:classappend="'erro__codigo--' + ${tom}" data-testid="erro-codigo"
       th:text="'Erro ' + ${codigo}">Erro 404</p>
    <div class="erro__texto">
        <h1 class="erro__titulo" data-testid="erro-titulo" th:text="${titulo}">Título</h1>
        <p class="erro__mensagem" data-testid="erro-mensagem" th:text="${mensagem}">Mensagem</p>
    </div>
    <div class="erro__acoes">
        <a class="botao botao--primario botao--bloco" data-testid="erro-acao-principal"
           th:href="${caminhoDoSite.valido(acaoHref)} ? ${acaoHref} : @{/}"
           th:text="${acaoRotulo}">Voltar ao início</a>
        <a class="botao botao--secundario botao--bloco" data-testid="erro-acao-secundaria" th:if="${acao2Rotulo != null}"
           th:href="${acao2Href}" th:text="${acao2Rotulo}">Voltar ao início</a>
    </div>
</section>
</body>
</html>
