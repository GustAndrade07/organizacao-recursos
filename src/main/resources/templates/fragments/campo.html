<!DOCTYPE html>
<!--/*
  Campo obrigatório de formulário de administração (telas 14 e 15): rótulo visível com "(obrigatório)", campo
  com required e aria-required, e a mensagem de erro junto dele. Uso:
    th:replace="~{fragments/campo :: campo('recurso-form', 'nome', 'Nome do recurso', 'text', ${recurso.nome}, ${erros?.get('nome')}, null, false, false)}"
  prefixo       : começo do id e do data-testid; o campo fica "prefixo-nome" e a mensagem "prefixo-nome-erro"
  nome          : atributo name do campo
  tipoCampo     : tipo do input (text, number, datetime-local) ou "textarea"
  valor         : valor atual; erro: mensagem do servidor (ou nulo); ajuda: texto de apoio (ou nulo)
  dinamico      : verdadeiro quando um script também mostra erro no campo; a mensagem existe sempre
                  (escondida enquanto vazia) e é um role="alert"
  somenteLeitura: verdadeiro para mostrar o valor sem deixar editar (readonly)
*/-->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Campo de formulário</title>
</head>
<body>
    <div class="campo"
         th:fragment="campo(prefixo, nome, rotulo, tipoCampo, valor, erro, ajuda, dinamico, somenteLeitura)"
         th:with="id=${prefixo + '-' + nome},
                  descrito=${#strings.trim((erro != null ? prefixo + '-' + nome + '-erro ' : '') + (ajuda != null ? prefixo + '-' + nome + '-ajuda' : ''))}">
        <!-- O id e o for fixos existem só para a análise estática do Sonar; o th:id e o th:for trocam pelos reais -->
        <th:block th:unless="${tipoCampo == 'textarea'}">
            <label class="campo__rotulo" for="campo-entrada" th:for="${id}"><th:block th:text="${rotulo}">Nome</th:block> <span class="campo__obrig">(obrigatório)</span></label>
            <input class="campo__entrada" id="campo-entrada"
                   th:classappend="${erro != null} ? 'campo__entrada--erro'"
                   th:id="${id}" th:name="${nome}" th:type="${tipoCampo}" th:value="${valor}" required aria-required="true"
                   th:readonly="${somenteLeitura}"
                   th:aria-invalid="${erro != null} ? 'true'"
                   th:aria-describedby="${#strings.isEmpty(descrito) ? null : descrito}"
                   th:attr="data-testid=${id}">
        </th:block>
        <th:block th:if="${tipoCampo == 'textarea'}">
            <label class="campo__rotulo" for="campo-area" th:for="${id}"><th:block th:text="${rotulo}">Nome</th:block> <span class="campo__obrig">(obrigatório)</span></label>
            <textarea class="campo__entrada campo__entrada--area" id="campo-area"
                      th:classappend="${erro != null} ? 'campo__entrada--erro'"
                      th:id="${id}" th:name="${nome}" required aria-required="true"
                      th:readonly="${somenteLeitura}"
                      th:aria-invalid="${erro != null} ? 'true'"
                      th:aria-describedby="${#strings.isEmpty(descrito) ? null : descrito}"
                      th:attr="data-testid=${id}" th:text="${valor}"></textarea>
        </th:block>
        <p class="campo__ajuda" th:if="${ajuda != null}" th:id="${id + '-ajuda'}" th:text="${ajuda}"></p>
        <p class="campo__erro" th:if="${erro != null or dinamico}" th:id="${id + '-erro'}"
           th:attr="data-testid=${id + '-erro'}" th:role="${dinamico} ? 'alert'"
           th:hidden="${erro == null}" th:text="${erro}"></p>
    </div>
</body>
</html>
