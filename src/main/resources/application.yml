spring:
  application:
    name: organizacao-recursos
  datasource:
    # Valores de desenvolvimento local (docker-compose.yml). Em outro ambiente, sobrescreva por variável de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recursos}
    username: ${DB_USER:recursos}
    password: ${DB_PASSWORD:recursos_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é do Flyway; o Hibernate só confere
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true        # erros do próprio Spring MVC também saem como ProblemDetail (RFC 9457)

server:
  error:
    # Resposta de erro nunca traz stack trace, mensagem interna nem nome de exceção (AGENTS.md, seção 5)
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

recursos:
  seguranca:
    jwt:
      # Segredo HS256 com no mínimo 32 bytes, só por variável de ambiente (AGENTS.md, seção 7).
      # Vazio: a aplicação gera um segredo aleatório a cada start (tokens antigos deixam de valer).
      segredo: ${JWT_SECRET:}
      emissor: organizacao-recursos
      validade: ${JWT_VALIDADE:PT1H}
  # Primeiro administrador, criado no start se ainda não existir um usuário com esse login.
  # Sem as duas variáveis, nada é criado. Nunca escrever a senha aqui.
  administrador-inicial:
    login: ${ADMIN_LOGIN:}
    senha: ${ADMIN_SENHA:}
    nome: ${ADMIN_NOME:Administrador}

management:
  endpoints:
    web:
      exposure:
        include: health
