spring:
  application:
    name: organizacao-recursos
  datasource:
    # Valores de desenvolvimento local (docker-compose.yml). Em outro ambiente, sobrescreva por variável de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recursos}
    username: ${DB_USER:recursos}
    password: ${DB_PASSWORD:recursos_dev}
  web:
    locale: pt-BR            # nomes de dia e datas em português, qualquer que seja o navegador
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é do Flyway; o Hibernate só confere
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        # Cookie da sessão das telas (D12, ADR-0009): fora do alcance de script e sem ir em navegação de outro site.
        # Secure só com HTTPS: ligue SESSAO_COOKIE_SEGURO=true fora do desenvolvimento local (ressalva do PR #48).
        http-only: true
        same-site: lax
        secure: ${SESSAO_COOKIE_SEGURO:false}
  error:
    # Resposta de erro nunca traz stack trace, mensagem interna nem nome de exceção (AGENTS.md, seção 5).
    # Os valores abaixo são os padrões do Spring Boot, escritos aqui para a regra ficar visível e não mudar sem querer.
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

recursos:
  telas:
    login:
      # Limite de tentativas do login das telas (ressalva 1 do PR #48, ADR-0009): este número de falhas do mesmo login
      # dentro da duração abaixo bloqueia esse login pela mesma duração. Contador em memória (uma instância só).
      tentativas: ${LOGIN_TENTATIVAS:5}
      bloqueio: ${LOGIN_BLOQUEIO:PT15M}
  seguranca:
    jwt:
      # Segredo HS256 com no mínimo 32 bytes, só por variável de ambiente (AGENTS.md, seção 7).
      # Vazio: a aplicação gera um segredo aleatório a cada start (tokens antigos deixam de valer).
      segredo: ${JWT_SECRET:}
      emissor: organizacao-recursos
      validade: ${JWT_VALIDADE:PT1H}
  # Primeiro administrador, criado no start se ainda não existir um usuário com esse login.
  # Sem as duas variáveis, nada é criado. Nunca escrever a senha aqui.
  administrador-inicial:
    login: ${ADMIN_LOGIN:}
    senha: ${ADMIN_SENHA:}
    nome: ${ADMIN_NOME:Administrador}

management:
  endpoints:
    web:
      exposure:
        include: health
