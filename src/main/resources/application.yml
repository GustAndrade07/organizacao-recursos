spring:
  application:
    name: organizacao-recursos
  datasource:
    # Valores de desenvolvimento local (docker-compose.yml). Em outro ambiente, sobrescreva por variável de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recursos}
    username: ${DB_USER:recursos}
    password: ${DB_PASSWORD:recursos_dev}
  web:
    locale: pt-BR            # nomes de dia e datas em português, qualquer que seja o navegador
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o esquema é do Flyway; o Hibernate só confere
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
