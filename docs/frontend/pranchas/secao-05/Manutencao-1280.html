<!doctype html>
<html lang="pt-BR" class="js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../../../../src/main/resources/static/css/tokens.css">
<link rel="stylesheet" href="../../../../src/main/resources/static/css/app.css">
<link rel="stylesheet" href="secao02.css">
<link rel="stylesheet" href="secao05.css">
</head>
<body>
<a class="pular-conteudo" href="#conteudo" data-testid="menu-pular">Pular para o conteúdo</a>
<header class="barra" data-aberto="false" data-menu>
<div class="barra__linha">
<a class="barra__marca" href="#" data-testid="menu-marca">Organização de Recursos</a>
<button type="button" class="menu__botao" data-testid="menu-abrir" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-painel"><span class="menu__barra"></span><span class="menu__barra"></span><span class="menu__barra"></span></button>
<nav class="menu__painel" id="menu-painel" aria-label="Principal">
<ul class="menu__lista">
<li><a class="menu__item" href="#" data-testid="menu-item-recursos" aria-current="page">Recursos</a></li>
<li><a class="menu__item" href="#" data-testid="menu-item-relatorios">Relatórios</a></li>
</ul>
<div class="menu__rodape">
<p class="menu__usuario"><span class="menu__nome" data-testid="menu-usuario">Marina Alves</span><span class="menu__perfil" data-testid="menu-perfil">Administrador</span></p>
<form action="#" method="post"><button type="submit" class="botao botao--secundario" data-testid="menu-sair">Sair</button></form>
</div>
</nav>
</div>
</header>
<main class="conteudo" id="conteudo" tabindex="-1">
<div class="secao">
<header class="pagina__cabecalho">
<h1 data-testid="manutencao-titulo">Bloquear para manutenção</h1>
<p class="pagina__descricao"><a href="#" data-testid="manutencao-voltar">Voltar para a lista de recursos</a></p>
</header>
<section class="cartao" aria-labelledby="manutencao-recurso-titulo" data-testid="manutencao-recurso">
<div class="cartao__cabecalho--linha">
<h2 class="cartao__titulo" id="manutencao-recurso-titulo">Auditório Central</h2>
<span class="situacao situacao--ativo">Ativo</span>
</div>
<dl class="lista-dados">
<dt>Tipo</dt>
<dd>Sala, 120 lugares</dd>
<dt>Localização</dt>
<dd>Bloco A, térreo</dd>
</dl>
</section>
<form class="cartao formulario" novalidate data-testid="manutencao-form">
<div class="grade-campos">
<div class="campo">
<label class="campo__rotulo" for="manutencao-inicio">Início do bloqueio <span class="campo__obrig">(obrigatório)</span></label>
<input class="campo__entrada" id="manutencao-inicio" name="inicio" type="datetime-local" value="2026-11-10T08:00" required aria-required="true" data-testid="manutencao-inicio">
</div>
<div class="campo">
<label class="campo__rotulo" for="manutencao-fim">Fim do bloqueio <span class="campo__obrig">(obrigatório)</span></label>
<input class="campo__entrada" id="manutencao-fim" name="fim" type="datetime-local" value="2026-11-20T18:00" required aria-required="true" data-testid="manutencao-fim">
</div>
</div>
<div class="campo">
<label class="campo__rotulo" for="manutencao-motivo">Motivo <span class="campo__obrig">(obrigatório)</span></label>
<textarea class="campo__entrada campo__entrada--area" id="manutencao-motivo" name="motivo" required aria-required="true" data-testid="manutencao-motivo">Reforma do sistema de som</textarea>
</div>
<div class="formulario__acoes">
<button type="submit" class="botao botao--primario" data-testid="manutencao-bloquear">Bloquear recurso</button>
<a class="botao botao--secundario" href="#" data-testid="manutencao-cancelar">Cancelar</a>
</div></form>
</div>
</main>
<script src="../../../../src/main/resources/static/js/menu.js" defer></script>
</body>
</html>
