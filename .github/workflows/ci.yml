name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um novo push na mesma branch/PR cancela a execução anterior ainda em andamento.
# A chave usa o nome da branch do PR (head_ref) e, fora de PR, a ref. Em 11/11/2026 o run 43094668839 do PR #42
# terminou todos os passos, mas ficou preso como in_progress no GitHub (a API recusou cancelar e reexecutar);
# com a chave antiga (github.ref = refs/pull/42/merge), todo run novo do PR ficou na fila esperando por ele.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud e a checagem de migrações precisam do histórico completo
      # ADR-0006: migração já mergeada na base não se edita (erro se corrige com a próxima versão).
      # A checagem compara com a base do PR; o auto-teste roda sempre e prova que ela falha quando deve.
      - name: Migrações existentes não podem ser alteradas (só em PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/verificar-migracoes-imutaveis.sh "origin/${BASE_REF}"
      - name: Auto-teste da checagem de migrações
        run: bash .github/scripts/testar-verificacao-migracoes.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # ADR-0004: o E2E (Playwright para Java, src/test/java/.../e2e) roda dentro do verify e precisa do Chromium
      # na versão da dependência do pom, com as bibliotecas do sistema.
      - name: Navegador do E2E (Chromium do Playwright)
        run: ./mvnw -B -q exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium" -Dexec.classpathScope=test
      - name: Build, testes e cobertura (JaCoCo 80/70 configurado no pom)
        run: ./mvnw -B verify
      - name: Relatórios como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports
            target/site/jacoco
      # Prints de evidência do E2E em 375 px (RF-13), um por tela e por passo dos fluxos
      - name: Prints do E2E como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-375
          path: target/e2e
      # PR vindo de fork não recebe secrets; nossos PRs saem de branches do próprio repositório.
      - name: SonarCloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
