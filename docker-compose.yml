services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recursos
      POSTGRES_USER: recursos
      POSTGRES_PASSWORD: recursos_dev   # só para desenvolvimento local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recursos"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
